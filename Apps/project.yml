# Xcode project for Albi's two builds. Both are the same menu-bar app
# (AlbiApp in the Swift package); they differ in where the tunnel runs:
#
#   Extension: ExtensionApp + ExtensionTunnel, a packet tunnel system
#     extension. Needs a paid Developer ID team. Sources in Extension/.
#   Helper: HelperApp + albi-helper, a root LaunchDaemon the app registers
#     with SMAppService. No paid team needed. Sources in Helper/.
#
# Generate with: cd Apps && xcodegen generate
name: Albi
options:
  bundleIdPrefix: $(ALBI_BUNDLE_ID_PREFIX)
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  # Icon Composer icons are bundles that actool compiles, not folders to copy.
  fileTypes:
    icon:
      file: true
      buildPhase: resources
configFiles:
  Debug: Config/Albi.xcconfig
  Release: Config/Albi.xcconfig
packages:
  Albi:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
targets:
  ExtensionApp:
    type: application
    platform: macOS
    # Shared: the app icon and menu-bar glyphs.
    sources: [Extension/App, Shared]
    dependencies:
      - package: Albi
        product: AlbiApp
      - package: Albi
        product: ExtensionBackend
      - target: ExtensionTunnel
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
      # Answers the extension's HIP requests, as the user. The same tool
      # as the helper build's.
      - target: albi-hipreport
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Extension/App/Info.plist
      properties:
        CFBundleDisplayName: Albi
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "27.0"
        LSUIElement: true
        AlbiTunnelBundleIdentifier: $(ALBI_BUNDLE_ID_PREFIX).tunnel
    entitlements:
      path: Extension/App/ExtensionApp.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider-systemextension]
        com.apple.developer.team-identifier: $(DEVELOPMENT_TEAM)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ALBI_BUNDLE_ID_PREFIX)
        # Not "Albi": both apps build into one DerivedData folder.
        PRODUCT_NAME: Albi Extension
        PROVISIONING_PROFILE_SPECIFIER: $(ALBI_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ExtensionTunnel:
    type: system-extension
    platform: macOS
    sources:
      - Extension/Tunnel
      # hipreport's built-in checks, in Contents/Resources/Library. The
      # extension's signature seals them; hipreport verifies it first.
      - path: ../Sources/HIPCore/Library
        type: folder
        buildPhase: resources
    dependencies:
      - package: Albi
        product: AlbiConstants
      - package: Albi
        product: GPCore
      - package: Albi
        product: GPMac
      - package: Albi
        product: Diagnostics
      # hipreport rides in Contents/MacOS, signed with the extension, so
      # the report comes from a binary the user can't swap. Step 1 checks
      # that the sandboxed extension may exec it.
      - target: hipreport
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Extension/Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Albi Tunnel
        LSMinimumSystemVersion: "27.0"
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)$(ALBI_BUNDLE_ID_PREFIX).tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Extension/Tunnel/ExtensionTunnel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider-systemextension]
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(ALBI_BUNDLE_ID_PREFIX)]
        com.apple.developer.team-identifier: $(DEVELOPMENT_TEAM)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ALBI_BUNDLE_ID_PREFIX).tunnel
        PRODUCT_NAME: $(ALBI_BUNDLE_ID_PREFIX).tunnel
        PRODUCT_MODULE_NAME: ExtensionTunnel
        PROVISIONING_PROFILE_SPECIFIER: $(ALBI_TUNNEL_PROFILE)
  hipreport:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/hipreport
    dependencies:
      - package: Albi
        product: HIPCore
    entitlements:
      # A child of a sandboxed process must be sandboxed and inherit its sandbox.
      path: Extension/hipreport/hipreport.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true
    settings:
      base:
        PRODUCT_NAME: hipreport
        PRODUCT_BUNDLE_IDENTIFIER: $(ALBI_BUNDLE_ID_PREFIX).hipreport
        SKIP_INSTALL: YES
  HelperApp:
    # The app whose tunnel runs in albi-helper, a root LaunchDaemon in
    # Contents/MacOS that the app registers with SMAppService from
    # Contents/Library/LaunchDaemons; no paid team needed. Signs ad hoc by
    # default; set ALBI_HELPER_SIGN_IDENTITY and ALBI_HELPER_TEAM in
    # Signing.xcconfig to sign with a free Apple Development certificate,
    # which keeps the helper's launchd registration valid across rebuilds.
    type: application
    platform: macOS
    sources:
      - Helper/App
      # The app icon and menu-bar glyphs.
      - Shared
      # hipreport's built-in checks, in Contents/Resources/Library.
      - path: ../Sources/HIPCore/Library
        type: folder
        buildPhase: resources
      - path: Helper/launchd/com.github.njvack.albi.helper.daemon.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      - path: Helper/launchd/com.github.njvack.albi.helper.login.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: Albi
        product: AlbiApp
      - package: Albi
        product: HelperBackend
      - target: albi-helper
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: albi-hipreport
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: Helper/App/Info.plist
      properties:
        CFBundleDisplayName: Albi
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "27.0"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ALBI_BUNDLE_ID_PREFIX).helper
        PRODUCT_NAME: Albi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: $(ALBI_HELPER_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(ALBI_HELPER_TEAM)
        ENABLE_HARDENED_RUNTIME: NO
  albi-helper:
    # The root LaunchDaemon. Signed with the app's identity: launchd
    # records its code requirement when the app registers it.
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/albi-helper
    dependencies:
      - package: Albi
        product: AlbiConstants
      - package: Albi
        product: GPCore
      - package: Albi
        product: GPMac
      - package: Albi
        product: Diagnostics
    settings:
      base:
        PRODUCT_NAME: albi-helper
        PRODUCT_BUNDLE_IDENTIFIER: $(ALBI_BUNDLE_ID_PREFIX).helper.daemon
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: $(ALBI_HELPER_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(ALBI_HELPER_TEAM)
        ENABLE_HARDENED_RUNTIME: NO
  albi-hipreport:
    # hipreport without the sandbox entitlements (a sandbox-inheriting
    # binary can't start from an unsandboxed parent): the helper runs it as
    # root, and ExtensionApp runs it as the user.
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/hipreport
    dependencies:
      - package: Albi
        product: HIPCore
    settings:
      base:
        PRODUCT_NAME: albi-hipreport
        PRODUCT_BUNDLE_IDENTIFIER: $(ALBI_BUNDLE_ID_PREFIX).helper.hipreport
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: $(ALBI_HELPER_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(ALBI_HELPER_TEAM)
        ENABLE_HARDENED_RUNTIME: NO

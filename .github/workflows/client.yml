name: client

on:
  push:
    branches: [main]
    paths: &paths
      - 'Sources/AlbiConstants/**'
      - 'Tests/AlbiConstantsTests/**'
      - 'Apps/AlbiHelper/*.plist'
      - 'Sources/GPCore/**'
      - 'Sources/GPMac/**'
      - 'Sources/GPCapture/**'
      - 'Sources/Diagnostics/**'
      - 'Sources/AlbiApp/**'
      - 'Sources/albi-cli/**'
      - 'Sources/albi-diag/**'
      - 'Sources/gp-capture/**'
      - 'Sources/albi-netprobe/**'
      - 'Tests/GPCoreTests/**'
      - 'Tests/GPMacTests/**'
      - 'Tests/GPCaptureTests/**'
      - 'Tests/DiagnosticsTests/**'
      - 'Tests/AlbiAppTests/**'
      - 'e2e/client.sh'
      - 'e2e/capture.sh'
      - 'e2e/diagnostics.sh'
      - 'e2e/netprobe.sh'
      - 'e2e/helper.sh'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/client.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: *paths
  workflow_dispatch:

# A new push to a PR cancels the run for the push before it; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  linux:
    if: github.event.action != 'labeled' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target GPCore
      - run: swift test --filter 'AlbiConstantsTests|GPCoreTests|GPCaptureTests|DiagnosticsTests'

  macos:
    # Unit tests for everything that needs SwiftPM on a Mac.
    if: github.event.action != 'labeled' || github.event.label.name == 'e2e'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --filter 'AlbiConstantsTests|GPCoreTests|GPMacTests|GPCaptureTests|DiagnosticsTests|AlbiAppTests'

  e2e:
    # Against gp-fake-gateway: albi-cli (userspace ping through the tunnel,
    # no root, no extension), gp-capture with Homebrew's openconnect run
    # through sudo, and diagnostics mode end to end (an outage writes a
    # redacted incident file, albi-diag replays it and drafts a scenario, the
    # draft reproduces it) plus albi-cli against every scenario. Uses the
    # fake's branch of the same name as this one when it has commits main
    # lacks, else main.
    #
    # Runs on pushes to main, by hand (Actions > client > Run workflow), and
    # on a PR once it carries the e2e label; later pushes to that PR run it
    # too. Not on every PR push, to save macOS runner time.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out gp-fake-gateway
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --quiet https://github.com/njvack/gp-fake-gateway.git gp-fake-gateway
          git -C gp-fake-gateway checkout --quiet "$BRANCH" 2>/dev/null || true
          # A same-name branch that main already contains is stale (merged
          # earlier); main is newer, so use it.
          if git -C gp-fake-gateway merge-base --is-ancestor HEAD origin/main; then
            git -C gp-fake-gateway checkout --quiet --detach origin/main
          fi
          git -C gp-fake-gateway log --oneline -1
      - uses: actions/setup-go@v5
        with:
          go-version-file: gp-fake-gateway/go.mod
          cache-dependency-path: gp-fake-gateway/go.mod
      - run: go build -o ../fakegp ./cmd/fakegp
        working-directory: gp-fake-gateway
      - run: brew install openconnect
      - run: swift build --product albi-cli && swift build --product albi-diag && swift build --product gp-capture
      - name: e2e client
        if: ${{ !cancelled() }}
        run: e2e/client.sh "$(swift build --show-bin-path)/albi-cli" "$PWD/fakegp" "$PWD/gp-fake-gateway/e2e/hipreport-stub.sh"
      - name: e2e capture
        if: ${{ !cancelled() }}
        run: e2e/capture.sh "$(swift build --show-bin-path)/gp-capture" "$PWD/fakegp" "$PWD/gp-fake-gateway/e2e/hipreport-stub.sh"
      - name: e2e diagnostics
        if: ${{ !cancelled() }}
        run: e2e/diagnostics.sh "$(swift build --show-bin-path)/albi-cli" "$(swift build --show-bin-path)/albi-diag" "$PWD/fakegp" "$PWD/gp-fake-gateway/scenarios"

  netprobe:
    # Root-helper probe: a utun with routes and temporary DNS keys, made by
    # albi-netprobe as root, must vanish when the process ends, on SIGTERM
    # and on kill -9, with no cleanup code. Its own job: the full-tunnel
    # scenarios cut the runner's network for a few seconds.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build --product albi-netprobe
      - run: e2e/netprobe.sh "$(swift build --show-bin-path)/albi-netprobe"

  helper:
    # The root helper's tunnel: sudo albi-cli connect --tun against
    # gp-fake-gateway with a real utun, routes and DNS, then the network
    # checked against its snapshot after SIGTERM and after kill -9 plus a
    # journal sweep. Its own job, like netprobe: full-tunnel scenarios take
    # the runner's IPv4 traffic for a few seconds.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out gp-fake-gateway
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --quiet https://github.com/njvack/gp-fake-gateway.git gp-fake-gateway
          git -C gp-fake-gateway checkout --quiet "$BRANCH" 2>/dev/null || true
          if git -C gp-fake-gateway merge-base --is-ancestor HEAD origin/main; then
            git -C gp-fake-gateway checkout --quiet --detach origin/main
          fi
          git -C gp-fake-gateway log --oneline -1
      - uses: actions/setup-go@v5
        with:
          go-version-file: gp-fake-gateway/go.mod
          cache-dependency-path: gp-fake-gateway/go.mod
      - run: go build -o ../fakegp ./cmd/fakegp
        working-directory: gp-fake-gateway
      - run: swift build --product albi-cli
      - run: e2e/helper.sh "$(swift build --show-bin-path)/albi-cli" "$PWD/fakegp"

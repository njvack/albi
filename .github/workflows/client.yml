name: client

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target GPCore
      - run: swift test --filter 'GPCoreTests|GPCaptureTests'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --product albi-cli
      - run: swift test --filter 'GPCoreTests|GPMacTests|GPCaptureTests'

  e2e:
    # albi-cli against gp-fake-gateway on a stock macOS runner: no root, no
    # extension; the CLI pings through the tunnel from userspace.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: njvack/gp-fake-gateway
          path: gp-fake-gateway
      - uses: actions/setup-go@v5
        with:
          go-version-file: gp-fake-gateway/go.mod
          cache-dependency-path: gp-fake-gateway/go.mod
      - run: go build -o ../fakegp ./cmd/fakegp
        working-directory: gp-fake-gateway
      - run: swift build --product albi-cli
      - run: e2e/client.sh "$(swift build --show-bin-path)/albi-cli" "$PWD/fakegp" "$PWD/gp-fake-gateway/e2e/hipreport-stub.sh"

  capture:
    # gp-capture against gp-fake-gateway with Homebrew's openconnect, run
    # through sudo the way it runs on a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: njvack/gp-fake-gateway
          path: gp-fake-gateway
      - uses: actions/setup-go@v5
        with:
          go-version-file: gp-fake-gateway/go.mod
          cache-dependency-path: gp-fake-gateway/go.mod
      - run: go build -o ../fakegp ./cmd/fakegp
        working-directory: gp-fake-gateway
      - run: brew install openconnect
      - run: swift build --product gp-capture
      - run: e2e/capture.sh "$(swift build --show-bin-path)/gp-capture" "$PWD/fakegp" "$PWD/gp-fake-gateway/e2e/hipreport-stub.sh"

  xcode:
    # Builds the app and the system extension unsigned. Signing, installing
    # and approving the extension happen on a real Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: Apps
      - name: Build (unsigned)
        working-directory: Apps
        # The runner's SDK may be older than the app's macOS 27 floor.
        run: |
          xcodebuild -project Albi.xcodeproj -scheme Albi -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= MACOSX_DEPLOYMENT_TARGET="$(xcrun --sdk macosx --show-sdk-version)" \
            build | tail -100
          exit "${PIPESTATUS[0]}"

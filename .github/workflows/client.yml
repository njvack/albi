name: client

on:
  push:
    branches: [main]
    paths: &paths
      - 'Sources/GPCore/**'
      - 'Sources/GPMac/**'
      - 'Sources/GPCapture/**'
      - 'Sources/Diagnostics/**'
      - 'Sources/AlbiApp/**'
      - 'Sources/albi-cli/**'
      - 'Sources/albi-diag/**'
      - 'Sources/gp-capture/**'
      - 'Tests/GPCoreTests/**'
      - 'Tests/GPMacTests/**'
      - 'Tests/GPCaptureTests/**'
      - 'Tests/DiagnosticsTests/**'
      - 'Tests/AlbiAppTests/**'
      - 'e2e/client.sh'
      - 'e2e/capture.sh'
      - 'e2e/diagnostics.sh'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/client.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

# A new push to a PR cancels the run for the push before it; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target GPCore
      - run: swift test --filter 'GPCoreTests|GPCaptureTests|DiagnosticsTests'

  macos:
    # One macOS job for everything that needs SwiftPM on a Mac, so the
    # package builds once: unit tests, then against gp-fake-gateway
    # albi-cli (userspace ping through the tunnel, no root, no extension),
    # gp-capture with Homebrew's openconnect run through sudo, and
    # diagnostics mode end to end (an outage writes a redacted incident
    # file, albi-diag replays it and drafts a scenario, the draft reproduces
    # it) plus albi-cli against every scenario. Uses the fake's branch of the
    # same name as this one when there is one, else main.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out gp-fake-gateway
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --quiet https://github.com/njvack/gp-fake-gateway.git gp-fake-gateway
          git -C gp-fake-gateway checkout --quiet "$BRANCH" 2>/dev/null || true
          git -C gp-fake-gateway log --oneline -1
      - uses: actions/setup-go@v5
        with:
          go-version-file: gp-fake-gateway/go.mod
          cache-dependency-path: gp-fake-gateway/go.mod
      - run: go build -o ../fakegp ./cmd/fakegp
        working-directory: gp-fake-gateway
      - run: brew install openconnect
      - run: swift --version
      - run: swift build --product albi-cli && swift build --product albi-diag && swift build --product gp-capture
      - run: swift test --filter 'GPCoreTests|GPMacTests|GPCaptureTests|DiagnosticsTests|AlbiAppTests'
      - name: e2e client
        if: ${{ !cancelled() }}
        run: e2e/client.sh "$(swift build --show-bin-path)/albi-cli" "$PWD/fakegp" "$PWD/gp-fake-gateway/e2e/hipreport-stub.sh"
      - name: e2e capture
        if: ${{ !cancelled() }}
        run: e2e/capture.sh "$(swift build --show-bin-path)/gp-capture" "$PWD/fakegp" "$PWD/gp-fake-gateway/e2e/hipreport-stub.sh"
      - name: e2e diagnostics
        if: ${{ !cancelled() }}
        run: e2e/diagnostics.sh "$(swift build --show-bin-path)/albi-cli" "$(swift build --show-bin-path)/albi-diag" "$PWD/fakegp" "$PWD/gp-fake-gateway/scenarios"

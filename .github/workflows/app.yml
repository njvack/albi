name: app

# Unsigned Xcode builds of the app with its system extension (which embeds
# hipreport) and of the menu-bar app. Signing, installing and approving the
# extension happen on a real Mac. AlbiAppTests run in client.yml.
on:
  push:
    branches: [main]
    paths: &paths
      - 'Apps/**'
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/app.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  xcode:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: Apps
      # The runner's SDK may be older than the app's macOS 27 floor. Both
      # schemes share DerivedData, so the package builds once.
      - name: Build Albi (unsigned)
        working-directory: Apps
        run: |
          status=0
          xcodebuild -project Albi.xcodeproj -scheme Albi -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= MACOSX_DEPLOYMENT_TARGET="$(xcrun --sdk macosx --show-sdk-version)" \
            build > build.log 2>&1 || status=$?
          tail -100 build.log
          # The tail can miss errors from targets that finished earlier.
          echo "== errors and warnings"
          grep -E ': (error|warning): ' build.log | sort -u || true
          exit $status
      - name: Build AlbiMenu (unsigned)
        if: ${{ !cancelled() }}
        working-directory: Apps
        run: |
          status=0
          xcodebuild -project Albi.xcodeproj -scheme AlbiMenu -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= MACOSX_DEPLOYMENT_TARGET="$(xcrun --sdk macosx --show-sdk-version)" \
            build > build.log 2>&1 || status=$?
          tail -100 build.log
          # The tail can miss errors from targets that finished earlier.
          echo "== errors and warnings"
          grep -E ': (error|warning): ' build.log | sort -u || true
          exit $status
      # A misfiled AppIcon.icon builds fine and ships no icon, so look for
      # it in each app's compiled asset catalog.
      - name: Check app icons
        if: ${{ !cancelled() }}
        run: |
          status=0
          for app in Albi "Albi Menu"; do
            dir=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Debug/$app.app" -maxdepth 5 | head -1)
            echo "== $app: $dir"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$dir/Contents/Info.plist" || status=1
            ls "$dir/Contents/Resources"
            xcrun assetutil --info "$dir/Contents/Resources/Assets.car" | grep -E '"(Name|RenditionName)"' | sort -u | head -40
            xcrun assetutil --info "$dir/Contents/Resources/Assets.car" | grep -q '"AppIcon"' || { echo "no AppIcon in $app"; status=1; }
          done
          exit $status
